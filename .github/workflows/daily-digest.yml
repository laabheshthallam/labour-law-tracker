name: Daily Labour Law Digest & Tracker Sync

on:
  schedule:
    # Runs every day at 18:00 IST (6:00 PM IST = 12:30 UTC)
    - cron: "30 12 * * *"
  workflow_dispatch: {}  # Allows manual triggering from GitHub Actions or Web UI

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Labour Law Tracker & Notifiers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python updater.py

      - name: Commit updated archive, sources, and static data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync: daily labour law tracker update [6:00 PM IST]"
          file_pattern: "data/archive.json data/sources.json docs/data/archive.json docs/data/sources.json"
